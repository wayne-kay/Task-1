<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asili Quest Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../Asili/login.css">

</head>
<body>

<div class="asili-login-panel">


    <!-- Logo -->
    <img src="../Asili/ASILI-logo.png" class="logo" alt="Asili Quest">


    <!-- asili QUEST heading -->
    <h1 class="bigheading" id="asili-heading">asili</h1>


    <h1 class="smallerheading" id="quest-heading">QUEST</h1>

    <!-- Welcome -->
    <h1 class="welcome-heading" id="welcome-heading">Welcome back!</h1>

    <p class="subtitle">
        Log in to continue your journey
        with Asili Quest.
    </p>

    <!-- Form -->

    <label>Email</label>

    <div class="input-box">
        <span>✉</span>
        <input type="email" name="Enter your email" placeholder="Enter your email">
    </div>

    <label>Password</label>

    <div class="input-box">
        <span>🔒</span>
        <input type="password" name="Enter your password" placeholder="Enter your password">
    </div>

    <div class="forgot">
        Forgot Password?
    </div>

    <button class="login-button" id="login-button"> 
        Log In
    </button>

    <div class="register">
        New to Asili Quest?
        <a href="#">Create an account</a>
    </div>

    <!-- Wildlife Footer -->

    <div class="footer">
        <img src="../Asili/asili-footer.png" alt="Asili Quest Footer">
    </div>

</div>


</body>
<script src="../Asili/login.js"></script>
</html>
